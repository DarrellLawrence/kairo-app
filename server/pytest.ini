[pytest]
testpaths = tests
addopts = -q
markers =
    fake_mode(mode): how the fake Claude CLI answers (KAIRO_HOOK_FAKE_MODE), set before the app starts
    turn_p(p): what the fake turn detector says (smart endpointing tests)
    llama_env(*names): FAKE_LLAMA_* switches set to 1 before the fake voice model starts
