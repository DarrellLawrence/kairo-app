# Who the owner is: PLACEHOLDERS ONLY (owner's decision 2026-10-15). Never put real values here:
# the repo is on GitHub. The real values live on the PC only, in data\config\profile.yaml (Kairo
# writes them there itself on the first start of a release with placeholders; change them there).
name: Owner
default_language: English
languages: [English, German]
timezone: Europe/Zurich
context: "work, school, training, side projects"
gmail: owner@example.com
quiet_hours: { start: "23:00", end: "06:00" }
push_devices: []
# Places (first start copies them into Settings; change them there or by voice).
# Only the station name is ever sent anywhere.
places: []
# School portal: read-only (never tests, quizzes, assignments; never posts). On the PC:
# school_portal: { kind: olat, url: "https://...", class: "..." }. Username and password are
# entered in the app (More -> Logins) and stored encrypted on the PC only.
school_portal: null
