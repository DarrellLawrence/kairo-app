# Job times (KICKOFF section 12). Used by the scheduler from Milestone C.
timezone_from_profile: true
reviews:                      # v5: daily check-in every evening; the biggest due review on Sundays
  daily: "21:00"
  big: "18:00"               # weekly / monthly (last Sun) / quarterly / half-year (Jun, Dec) / yearly (Dec)
brain:
  max_runs_per_day: 60        # daily run budget; on limit jobs pause (KICKOFF 7, 18b)
jobs:
  email_triage:    { cron: "0 7-21 * * *" }
  morning_brief:   { weekdays: "20 6 * * 1-5", weekends: "20 8 * * 6,0" }
  capture_process: { every_minutes: 15, only_if_inbox_non_empty: true }
  evening_checkin: { cron: "0 21 * * *" }
  weekly_review:   { cron: "0 18 * * 0" }
  lerndoku_prompt: { cron: "30 17 * * 5" }
