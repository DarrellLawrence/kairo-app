name: ci
on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; only the release job asks for more.
permissions:
  contents: read

jobs:
  # The setup zip, built once (fix P2.12): every test below runs on exactly this file, and the
  # release publishes exactly this file.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false        # npm install scripts run in this job
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build setup zip (with its release check)
        run: scripts/build-release.sh
      # Owner's master prompt 0.6: the zip that may be published holds no secret and no private/, data/, secrets/ or
      # .env path. build-release.sh already scanned it; this is the same check as a visible step. The owner's personal
      # terms are NOT given to this job (it runs npm install scripts): the job privacy-zip checks them on exactly
      # this file, and the release waits for it.
      - name: Privacy scan of the setup zip (secrets and paths)
        run: python scripts/privacy_scan.py --secrets-only --zip dist/Kairo-Setup-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: setup-zip
          path: |
            dist/Kairo-Setup-*.zip
            dist/Kairo-Setup-*.zip.sha256
            dist/VERSION
          if-no-files-found: error
          retention-days: 30

  # Owner's master prompt 0.6 (the code may become public; all personal data lives on the PC only): the whole
  # history, every branch and tag, must hold no personal term, secret or private/ data/ .env path. Two scanners:
  # scripts/privacy_scan.py with the owner's terms from the PERSONAL_TERMS secret (names are never printed, only
  # file:line and the rule number) and a pinned, checksum-verified gitleaks (its output is reduced to rule, file, line
  # and commit by privacy_scan.py --gitleaks-report: never --verbose, which prints the matched line and the author).
  # A pull request is checked with the scanner and the gitleaks config of its BASE branch, never with its own copy,
  # so changing them does not help it pass. This workflow file itself comes from the pull request, though: a pull
  # request that edits .github/ can skip these steps or read the secret. Only review stops that (CONTRIBUTING.md).
  # Pull requests: the commits the pull request adds must be clean (hard); the whole old history is reported but
  # does not fail the pull request (it holds the old private/ file until the history is rewritten, task 97).
  # Pushes to main: the whole history, hard. Without the secret this job is an error on main (so it is noticed) and
  # a warning elsewhere (pull requests from forks never get secrets). The release does not wait for this job
  # (it is red until the rewrite); it waits for privacy-zip, which checks what actually ships.
  privacy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"   # gitleaks_8.30.0_linux_x64.tar.gz
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Choose the scanner (a pull request is judged by its base branch's scanner and config)
        run: |
          scanner=scripts/privacy_scan.py
          config=.gitleaks.toml
          if [ "$EVENT" = "pull_request" ]; then
            trusted="$RUNNER_TEMP/trusted"
            mkdir -p "$trusted"
            if git show "origin/${BASE_REF}:scripts/privacy_scan.py" > "$trusted/privacy_scan.py" 2>/dev/null \
               && git show "origin/${BASE_REF}:.gitleaks.toml" > "$trusted/gitleaks.toml" 2>/dev/null; then
              scanner="$trusted/privacy_scan.py"
              config="$trusted/gitleaks.toml"
              echo "Using the scanner and the gitleaks config of ${BASE_REF}, not the ones in this pull request."
            else
              echo "::warning::${BASE_REF} has no privacy scanner yet (this is the pull request that adds it): this run uses the pull request's own copy."
            fi
          fi
          echo "SCANNER=$scanner" >> "$GITHUB_ENV"
          echo "GITLEAKS_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Personal terms, secrets and forbidden paths in the commits this pull request adds
        if: ${{ github.event_name == 'pull_request' }}
        env:
          KAIRO_PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
        run: python "$SCANNER" --ci --history "origin/${BASE_REF}..HEAD"
      - name: Personal terms, secrets and forbidden paths in the whole history
        if: ${{ !cancelled() }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          KAIRO_PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
        run: python "$SCANNER" --ci --history
      - name: Get gitleaks (pinned release, checksum verified)
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: gitleaks on the whole history (archives up to 3 deep; only rule, file, line and commit are printed)
        if: ${{ !cancelled() }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          KAIRO_PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
        run: |
          rm -f .gitleaksignore          # gitleaks reads it whatever --config says; the scanner flags the file itself
          rc=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --max-archive-depth 3 --config "$GITLEAKS_CONFIG" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --log-opts="--all" . || rc=$?
          python "$SCANNER" --gitleaks-report "$RUNNER_TEMP/gitleaks.json" || true
          exit $rc

  # What actually ships (owner's master prompt 0.6): exactly the zip the build job made, with the owner's terms from
  # the PERSONAL_TERMS secret, then gitleaks on the unpacked zip. --ci makes a missing secret an error on main and
  # anything that could not be scanned an error. The release job needs this job, so a release is never published
  # without the terms check. A pull request from this repository is red already when the secret is missing, so it is
  # noticed before the merge, not as a release that silently stops. The secret is only given to the scanner's step,
  # in a job that runs no project code.
  privacy-zip:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.0"
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"   # gitleaks_8.30.0_linux_x64.tar.gz
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Choose the scanner (a pull request is judged by its base branch's scanner and config)
        run: |
          scanner=scripts/privacy_scan.py
          config=.gitleaks.toml
          if [ "$EVENT" = "pull_request" ]; then
            trusted="$RUNNER_TEMP/trusted"
            mkdir -p "$trusted"
            if git show "origin/${BASE_REF}:scripts/privacy_scan.py" > "$trusted/privacy_scan.py" 2>/dev/null \
               && git show "origin/${BASE_REF}:.gitleaks.toml" > "$trusted/gitleaks.toml" 2>/dev/null; then
              scanner="$trusted/privacy_scan.py"
              config="$trusted/gitleaks.toml"
              echo "Using the scanner and the gitleaks config of ${BASE_REF}, not the ones in this pull request."
            else
              echo "::warning::${BASE_REF} has no privacy scanner yet (this is the pull request that adds it): this run uses the pull request's own copy."
            fi
          fi
          echo "SCANNER=$scanner" >> "$GITHUB_ENV"
          echo "GITLEAKS_CONFIG=$config" >> "$GITHUB_ENV"
      - name: The PERSONAL_TERMS secret is set (without it the zip's terms cannot be checked and nothing is released)
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          HAS_TERMS: ${{ secrets.PERSONAL_TERMS != '' }}
        run: |
          if [ "$HAS_TERMS" != "true" ]; then
            echo "::error::The repository secret PERSONAL_TERMS is missing or empty, so the setup zip cannot be checked for personal terms and no release is published. The owner adds it: Settings, Secrets and variables, Actions, New repository secret, name PERSONAL_TERMS, one term per line (CONTRIBUTING.md)."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: setup-zip
          path: dist
      - name: Personal terms, secrets and forbidden paths in the setup zip
        env:
          KAIRO_PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
        run: python "$SCANNER" --ci --zip dist/Kairo-Setup-*.zip
      - name: Get gitleaks (pinned release, checksum verified)
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: gitleaks on the unpacked setup zip (archives up to 3 deep; only rule, file and line are printed)
        if: ${{ !cancelled() }}
        env:
          KAIRO_PERSONAL_TERMS: ${{ secrets.PERSONAL_TERMS }}
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          unzip -q dist/Kairo-Setup-*.zip -d "$RUNNER_TEMP/unpacked"
          rm -f "$RUNNER_TEMP/unpacked/.gitleaksignore"   # gitleaks reads it whatever --config says
          rc=0
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner --max-archive-depth 3 --config "$GITLEAKS_CONFIG" \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" "$RUNNER_TEMP/unpacked" || rc=$?
          python "$SCANNER" --gitleaks-report "$RUNNER_TEMP/gitleaks.json" || true
          exit $rc

  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -o addopts=""
        working-directory: server

  # Phase 3 voice, for real: Kokoro and Piper speak, Whisper (CPU) writes it down again.
  voice:
    runs-on: ubuntu-24.04
    env:
      KAIRO_VOICE_TEST: "1"
      KAIRO_WHISPER_MODEL: base
      KAIRO_WHISPER_CPU_MODEL: base
      KAIRO_VOICE_MODELS: ${{ github.workspace }}/voice-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: voice-models
          key: voice-models-v1
      - run: pip install -r server/requirements-dev.txt -r server/requirements-voice.txt
      - run: python -m pytest -o addopts="" tests/test_voice.py tests/test_voicelab.py tests/test_voice_rtc.py tests/test_speaker.py tests/test_outbound.py tests/test_bench_corpus.py tests/test_bench_voice.py -s
        working-directory: server

  # Owner's report 2026-10-17: the voice folder exactly as the installer builds it on kairo-home (Kairo.psm1
  # Invoke-ToolPip: the voice packages, then onnxruntime-gpu with --no-deps), the models from app.voice,
  # then the self-test's voice checks with Kairo's venv first and the folder appended. This path never
  # ran in CI before (windows-install skips voice); a release that breaks it never reaches the PC.
  voice-install-windows:
    runs-on: windows-latest
    env:
      KAIRO_WHISPER_MODEL: base
      KAIRO_WHISPER_CPU_MODEL: base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kairo-voice/voice-models
          key: voice-install-models-${{ hashFiles('server/app/voice/__init__.py') }}
      - name: Build the voice folder like the installer and check it
        shell: powershell
        run: installer\ci\Test-VoiceInstall.ps1 -Repo $env:GITHUB_WORKSPACE -Work (Join-Path $env:RUNNER_TEMP 'kairo-voice')

  # Voice V3 (owner's request 2026-10-16): a call over WebRTC on Windows, like kairo-home: a fake phone
  # (aiortc) sends real speech, the real Silero VAD and Smart Turn decide, the audio comes back; through
  # the app too (/api/rtc/offer, the fake voice model). Only the call's packages, pinned as on the PC.
  voice-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the call packages (pins from requirements-voice.txt)
        shell: pwsh
        run: |
          Select-String -Path server/requirements-voice.txt -Pattern '^(pipecat-ai|aiortc|av)==' |
            ForEach-Object { ($_.Line -split '\s+')[0] } | Set-Content rtc-req.txt
          Get-Content rtc-req.txt
          pip install -r server/requirements-dev.txt -r rtc-req.txt
      - run: python -m pytest -o addopts="" tests/test_voice_rtc.py tests/test_speaker.py tests/test_outbound.py tests/test_bench_corpus.py tests/test_bench_voice.py -s
        working-directory: server

  # v8 C6: the real embedding model (Qwen3-Embedding, CPU int8) in its own process, its packages in a
  # separate folder like kairo-home's tools\memory-<hash>: a German question finds the English note.
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KAIRO_MEMORY_TEST: "1"
      KAIRO_MEMORY_MODELS: ${{ github.workspace }}/memory-model
      KAIRO_MEMORY_SITE: ${{ github.workspace }}/memory-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: memory-model
          key: memory-model-${{ hashFiles('server/requirements-memory.txt') }}
      - run: pip install -r server/requirements-dev.txt
      - run: pip install --disable-pip-version-check --target memory-site -r server/requirements-memory.txt
      - run: python -m pytest -o addopts="" tests/test_semantic.py -s
        working-directory: server

  # The school portal's read-only rule in a real browser (Chromium) against a fake OLAT.
  browser:
    runs-on: ubuntu-24.04
    env:
      KAIRO_BROWSER_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt -r server/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -o addopts="" tests/test_portal.py tests/test_portal_browser.py tests/test_gauntlet.py -s
        working-directory: server

  # The setup zip itself has hands (fix P0): built like the release (with its release check),
  # extracted, its own requirements in a clean venv, then the shipped app, mcp_kairo and safety
  # hook driven by the fake CLI: self-test, a proposal that makes a card, one the hook blocks.
  release-tools:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: setup-zip
          path: dist
      - name: Extract it and install its requirements in a clean venv
        run: |
          mkdir -p "$RUNNER_TEMP/rel"
          unzip -q dist/Kairo-Setup-*.zip -d "$RUNNER_TEMP/rel"
          app=$(ls -d "$RUNNER_TEMP"/rel/Kairo-Setup-*/app)
          python -m venv "$RUNNER_TEMP/relvenv"
          "$RUNNER_TEMP/relvenv/bin/pip" install -q -r "$app/server/requirements.txt"
          echo "KAIRO_RELEASE_APP=$app" >> "$GITHUB_ENV"
          echo "KAIRO_RELEASE_PY=$RUNNER_TEMP/relvenv/bin/python" >> "$GITHUB_ENV"
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest -o addopts="" tests/test_release_tools.py -v
        working-directory: server

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  # Builds the real setup zip and installs, updates, breaks, rolls back and
  # uninstalls it on a Windows machine with Windows PowerShell 5.1.
  windows-install:
    needs: build
    runs-on: windows-latest
    env:
      # 2 GB of speech packages; the voice job tests them on Linux. The browser is installed for
      # real: same install path as voice (versioned folder, rights reset), checked as kairo-svc.
      KAIRO_SKIP_VOICE: "1"
      # 3 GB (GPU runtime + model); the memory job tests the same folder layout on Windows and Linux.
      KAIRO_SKIP_MEMORY: "1"
      KAIRO_SKIP_VOICELLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: setup-zip
          path: dist
      - name: Let normal users read Python (like C:\Program Files on a real PC)
        shell: powershell
        run: |
          $root = Split-Path (Split-Path '${{ steps.py.outputs.python-path }}')
          icacls $root /grant '*S-1-5-32-545:(OI)(CI)RX' /T /Q | Out-Null
      - name: Get Syncthing (the real PC gets it from winget)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/syncthing/syncthing/releases/latest --jq '.assets[] | select(.name | test("windows-amd64.*zip$")) | .browser_download_url')
          curl -sSL "$url" -o "$RUNNER_TEMP/st.zip"
          mkdir -p "$RUNNER_TEMP/st" && unzip -q "$RUNNER_TEMP/st.zip" -d "$RUNNER_TEMP/st"
          exe=$(find "$RUNNER_TEMP/st" -name syncthing.exe | head -1)
          echo "KAIRO_SYNCTHING=$(cygpath -w "$exe")" >> "$GITHUB_ENV"
      - name: Install / update / rollback / uninstall
        shell: powershell
        env:
          KAIRO_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          $zip = (Get-ChildItem dist -Filter 'Kairo-Setup-*.zip' | Select-Object -First 1).FullName
          & .\installer\ci\Test-Install.ps1 -Zip $zip -FakeClaude (Resolve-Path server\tests\fakes\fake_claude.py).Path
      - name: Installer logs
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem C:\KairoCI\data\logs -ErrorAction SilentlyContinue | ForEach-Object { "==== $($_.Name)"; Get-Content $_.FullName -Tail 200 }
          foreach ($f in @('C:\KairoCI\updater\auto-update.log', 'C:\KairoCI\install.log')) { if (Test-Path $f) { "==== $f"; Get-Content $f -Tail 200 } }

  # Only the exact zip that passed everything above becomes "the latest tested version" that
  # kairo-home installs (fix P2.11/12): every job must succeed; a skipped one blocks the release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, privacy-zip, server, voice, voice-windows, voice-install-windows, browser, web, release-tools, windows-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: setup-zip
          path: dist
      - name: Check the zip is the tested one
        run: |
          cd dist
          sha256sum -c Kairo-Setup-*.zip.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat dist/VERSION)
          # "[urgent]" in the merged PR's title: kairo-home installs it even in the quiet hours.
          urgent=""
          if git log -1 --format=%B | grep -qi '\[urgent\]'; then urgent="[urgent] "; fi
          gh release create "v$v" dist/Kairo-Setup-*.zip dist/Kairo-Setup-*.zip.sha256 \
            --title "Kairo $v" \
            --notes "${urgent}To install: under Assets download Kairo-Setup-$v.zip (NOT Source code), right-click it, Extract All, then double-click Install Kairo.bat. Tested on Linux and Windows (install, update, automatic rollback, uninstall). Commit ${GITHUB_SHA}."
