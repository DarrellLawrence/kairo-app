# Permission table (KICKOFF section 8). Enforced by server/app/gate.py from Milestone B.
default: deny

tiers:
  0_read:        { mode: auto }
  1_internal:    { mode: auto }
  2_reversible:  { mode: auto, digest: true }
  3_outbound:    { mode: approve }
  4_destructive: { mode: approve, confirm_twice: true }
  5_money:       { mode: never }

actions:
  gmail.search:          0_read
  gmail.read:            0_read
  calendar.list:         0_read
  vault.read:            0_read
  tasks.list:            0_read
  tasks.create:          1_internal
  tasks.update:          1_internal
  notes.write:           1_internal   # Kairo-owned files only
  # phase 3: Kairo's own life data (read, or add to Kairo's own tables)
  shopping.list:         0_read
  people.list:           0_read
  finance.list:          0_read       # read only; money actions don't exist (tier 5)
  health.list:           0_read
  memory.search:         0_read       # v8 C6: the owner's notes by keywords and meaning (local index)
  coach.status:          0_read       # v8 E: plans, streaks, today's session (no money: tier 5 has no tools)
  coach.log:             1_internal   # v8 E: a session done, water, food packed, the faith habit (Kairo's own table)
  profile.import:        1_internal   # v8 G: the owner's own profile, stored as-is in 10 Profile/
  profile.apply:         1_internal   # v8 G: what it says: people, loops, calendar rules, coach facts, exams (own tables)
  shopping.add:          1_internal
  people.note:           1_internal
  captures.answer:       1_internal   # v8 B: the owner answered a quick question in chat
  wishlist.add:          1_internal   # v8 B: a gift idea on that person's wishlist (Kairo's own table)
  knowledge.ask_later:   1_internal   # a question for the next getting-to-know-you call (no secrets: refused)
  knowledge.answered:    1_internal
  profile.learn:         1_internal   # vault 10 Profile/Learned by Kairo.md, Kairo's own section
  pending.list:          0_read       # 2026-11-04: what waits on the owner in Kairo's own app (quick / knowledge questions)
  pending.clear:         1_internal   # the owner said to clear them: status only, nothing deleted
  pending.restore:       1_internal   # undo a clear
  document.create:       1_internal   # gauntlet: PDF in vault Kairo/Documents; the mail to self is gated again (tier 2)
  settings.list:         0_read       # owner settings (not the gate, not permissions)
  settings.set:          1_internal
  place.set:             1_internal   # home / school / work / training; only station names leave the PC
  place.remove:          1_internal
  debrief:               0_read       # PA rule 1: what's going on, by time of day
  loops.list:            0_read       # open loops: what is still waiting
  loops.add:             1_internal
  loops.snooze:          1_internal   # "not now", "tomorrow", "in an hour"
  loops.close:           1_internal   # done / "drop it"
  calendar.tag:          1_internal   # v7: FIXED / SOCIAL / FLEXIBLE, kept in Kairo's own table
  # tier 2-4: reachable ONLY via mcp_kairo.propose_action; executed by the backend
  gmail.label:           2_reversible
  gmail.create_draft:    2_reversible
  calendar.create_hold:  2_reversible # own calendar, marked [Kairo], no attendees (rule below)
  calendar.move:         2_reversible # v7: own FLEXIBLE events without guests, sendUpdates none
  gmail.send_self:       2_reversible # v7: only to profile.gmail; no recipient field exists
  gmail.trash:           2_reversible # v7: Gmail keeps trash 30 days
  gmail.send:            3_outbound
  gmail.reply:           3_outbound
  calendar.respond:      3_outbound
  calendar.delete:       4_destructive

rules:
  calendar.create_hold:
    calendar: primary
    title_prefix: "[Kairo]"
    deny_if_present: [attendees, guests, sendUpdates, sendNotifications, conferenceData, guestsCanInviteOthers, guestsCanModify]
    allow_only_fields: [summary, description, start, end, location, reminders, colorId, transparency, recurrence, time_zone]   # recurrence: weekly with an end only (actions.py)

limits:
  approvals_open_max: 10
  outbound_per_day_max: 20
